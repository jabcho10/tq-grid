name: Update closing prices

on:
  # 21:00 UTC = 미 동부 17:00(EDT) / 16:00(EST) — 정규장 마감 직후
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 종가 수집
        run: python scripts/fetch_prices.py

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "종가 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "chore(data): 종가 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
