name: Update prices and deploy

on:
  push:
    branches: [main]
  # 22:00 UTC = 미 동부 18:00(EDT) / 17:00(EST) — 정규장 마감 후
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write     # 갱신된 종가 커밋
  pages: write        # Pages 배포
  id-token: write     # deploy-pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 시세 서버가 러너 IP를 막아도 배포는 계속한다.
      # 실패하면 직전에 커밋된 종가가 그대로 서빙된다.
      - name: 종가 수집
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_prices.py

      - name: 변경분 커밋
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "종가 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "chore(data): 종가 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: 사이트 구성
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp .nojekyll _site/
          cp data/prices.json _site/data/
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
